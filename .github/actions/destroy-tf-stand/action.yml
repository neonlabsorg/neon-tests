name: "Destroy stand"
description: "Destroy stand created by terraform"
inputs:
  working-directory:
    description: 'Working directory for the commands'
    required: false
    default: '.'
  ci_stands_key_hcloud:
    description: 'Private key for hcloud'
    required: true
runs:
  using: composite
  steps:
    - name: Set environment variables
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
        AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
        AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        HCLOUD_TOKEN: ${{secrets.HCLOUD_TOKEN}}
        TFSTATE_BUCKET: ${{vars.TFSTATE_BUCKET}}
        TFSTATE_KEY: ${{vars.TFSTATE_KEY_PREFIX}}-${{ github.run_number }}
        TFSTATE_REGION: ${{vars.TFSTATE_REGION}}
      run: |
        echo "Environment variables set"
    - name: Change the working directory
      shell: bash
      run: |
        cd ${{ inputs.working-directory }}
    - uses: hashicorp/setup-terraform@v3
    - uses: actions/setup-node@v4
      with:
        node-version: 16
    - name: Install python requirements
      if: always()
      id: requirements
      uses: ./.github/actions/python-requirements
      with:
        working-directory: ${{ inputs.working-directory }}
    - name: Prepare server for destroy terraform stand
      if: always()
      shell: bash
      run: |
        ssh_key=/tmp/ci-stands
        echo "${{ inputs.ci_stands_key_hcloud  }}" >> ${ssh_key} && chmod 400 ${ssh_key}
    - name: Download docker logs
      shell: bash
      run: python3 ./clickfile.py infra download-logs
    - name: Destroy stand with terraform
      shell: bash
      id: destroy
      if: always()
      run: |
        python3 ./clickfile.py infra destroy
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Docker logs
        path: ./logs/*