name: "Prepare stand"
description: "Create terraform stand"
outputs:
  instance_public_ip_v4:
    value: ${{ steps.create-instance.outputs.public-ip-v4 }}
  docker_ca_cert:
    value: ${{ steps.prepare-docker-instance.outputs.docker_ca_cert }}
  docker_cert:
    value: ${{ steps.prepare-docker-instance.outputs.docker_cert }}
  docker_key:
    value: ${{ steps.prepare-docker-instance.outputs.docker_key }}

inputs:
  hcloud_token:
    required: true
  aws_secret_access_key_id:
    required: true
  aws_secret_access_key:
    required: true
  aws_default_region:
    required: true
  use_real_price:
    description: 'Remove CONST_GAS_PRICE option from proxy'
    default: '0'
    required: false
  memory:
    description: "Instance memory amount"
    default: 32
    required: false
  cpu:
    description: "Instance CPU amount"
    default: 16
    required: false
  docker_username:
    description: 'docker hub username'
    required: true
  docker_password:
    description: 'docker hub password'
    required: true
  gh_token:
    required: true


runs:
  using: composite

  steps:
  - uses: actions/checkout@v4
    with:
      fetch-depth: 0
  - uses: actions/checkout@v4
    with:
      repository: 'neonlabsorg/dynamic-ci-cd'
      ref: 'feat/prepare-instance'
      token: ${{ inputs.gh_token }}
      path: ./dynamic-ci-cd
  - name: Create instance
    uses: ./dynamic-ci-cd/actions/create-instance
    id: create-instance
    with:
      project-repository: ${{ github.event.repository.name }}
      run-id: ${{github.run_id}}
      cpu: 16
      memory: 32
      hcloud-token: ${{ inputs.hcloud_token }}
    env:
      AWS_ACCESS_KEY_ID: ${{ inputs.aws_secret_access_key }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_default_region }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key_id }}
  - name: Install docker
    uses: ./actions/prepare-docker-instance
    id: prepare-docker-instance
    with:
        host: ${{ steps.create-instance.outputs.public-ip-v4 }}
        ssh-user: ${{ steps.create-instance.outputs.ssh-user }}
        ssh-key: ${{ steps.create-instance.outputs.ssh-key }}
  - name: Run docker containers
    uses: ./actions/run-docker-containers
    id: run-docker-containers
    with:
        docker_host: ${{ steps.create-instance.outputs.public-ip-v4 }}
        docker_ca_cert: ${{ steps.prepare-docker-instance.outputs.docker_ca_cert }}
        docker_cert: ${{ steps.prepare-docker-instance.outputs.docker_cert }}
        docker_key: ${{ steps.prepare-docker-instance.outputs.docker_key }}
        docker_containers_wait_for_ready_seconds: 30
        docker_compose: |
          version: "3"

          services:
            solana:
              image: ${DOCKERHUB_ORG_NAME}/evm_loader:${NEON_EVM_COMMIT}
              container_name: solana
              environment:
                SOLANA_URL: http://127.0.0.1:8899
                DEVNET_SOLANA_URL: $DEVNET_SOLANA_URL
              hostname: solana
              networks:
                - net
              expose:
                - 8899
              ports:
                - "8899:8899"
              healthcheck:
                # Must be available from outside (calling without -u causes premature result)
                test: [ '/bin/bash', '-c', 'curl http://localhost:8899 -s -X POST -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}" | grep -cF "ok"']
                interval: 5s
                timeout: 5s
                retries: 20
                start_period: 5s
              entrypoint: /opt/solana-run-neon.sh

            neon-core-api:
              container_name: neon-core-api
              restart: unless-stopped
              hostname: neon_api
              entrypoint:
                /opt/neon-api -H 0.0.0.0:8085
              environment:
                RUST_BACKTRACE: 1
                RUST_LOG: debug
                NEON_API_LISTENER_ADDR: 0.0.0.0:8085
                SOLANA_URL: http://solana:8899
                EVM_LOADER: 53DfF883gyixYNXnM7s5xhdeyV8mVk9T4i2hGV9vG9io
                SOLANA_KEY_FOR_CONFIG: BMp6gEnveANdvSvspESJUrNczuHz1GF5UQKjVLCkAZih
                COMMITMENT: confirmed
                NEON_DB_CLICKHOUSE_URLS: "http://45.250.253.36:8123;http://45.250.253.38:8123"
              image: $DOCKERHUB_ORG_NAME/evm_loader:$NEON_EVM_COMMIT
              ports:
              - "8085:8085"
              expose:
              - "8085"
              networks:
                - net
            
            neon-core-rpc:
              restart: unless-stopped
              container_name: neon-core-rpc
              hostname: neon_core_rpc
              entrypoint: /opt/neon-rpc /opt/libs/current
              environment:
                RUST_BACKTRACE: full
                RUST_LOG: neon=debug
                NEON_API_LISTENER_ADDR: 0.0.0.0:3100
                SOLANA_URL: http://solana:8899
                EVM_LOADER: 53DfF883gyixYNXnM7s5xhdeyV8mVk9T4i2hGV9vG9io
                NEON_TOKEN_MINT: HPsV9Deocecw3GeZv1FkAPNCBRfuVyfw9MMwjwRe1xaU
                NEON_CHAIN_ID: 111
                COMMITMENT: confirmed
                NEON_DB_CLICKHOUSE_URLS: "http://45.250.253.36:8123;http://45.250.253.38:8123"
                NEON_DB_INDEXER_HOST: 45.250.253.32
                NEON_DB_INDEXER_PORT: 5432
                NEON_DB_INDEXER_DATABASE: indexer
                NEON_DB_INDEXER_USER: postgres
                NEON_DB_INDEXER_PASSWORD: "vUlpDyAP0gA98R5Bu"
                KEYPAIR: /opt/operator-keypairs/id.json
                FEEPAIR: /opt/operator-keypairs/id.json
              image: $DOCKERHUB_ORG_NAME/evm_loader:$NEON_EVM_COMMIT
              ports:
                - "3100:3100"
              expose:
                - "3100"
              networks:
                - net

            postgres:
              image: postgres:17.0
              container_name: postgres
              command: postgres -c 'max_connections=1000'
              environment:
                POSTGRES_DB: neon-db
                POSTGRES_USER: neon-proxy
                POSTGRES_PASSWORD: neon-proxy-pass
              hostname: postgres
              healthcheck:
                test: [ CMD-SHELL, "pg_isready -h postgres -p 5432" ]
                interval: 3s
                timeout: 3s
                retries: 10
                start_period: 5s
              expose:
                - 5432
              networks:
                - net

            dbcreation:
              image: ${DOCKERHUB_ORG_NAME}/neon-proxy.py:${REVISION}
              container_name: dbcreation
              environment:
                SOLANA_URL: http://solana:8899
                POSTGRES_DB: neon-db
                POSTGRES_USER: neon-proxy
                POSTGRES_PASSWORD: neon-proxy-pass
                POSTGRES_HOST: postgres
              entrypoint: /bin/sh
              command: db/run-dbcreation.sh
              networks:
                - net
              depends_on:
                postgres:
                  condition: service_healthy

            proxy:
              image: ${DOCKERHUB_ORG_NAME}/neon-proxy.py:${REVISION}
              container_name: proxy
              environment:
                SOLANA_URL: http://solana:8899
                EXTRA_ARGS: "--num-workers 16"
                FAUCET_URL: http://faucet:3333
                PROXY_URL: http://proxy:9090/solana
                POSTGRES_DB: neon-db
                POSTGRES_USER: neon-proxy
                POSTGRES_PASSWORD: neon-proxy-pass
                POSTGRES_HOST: postgres
                DEBUG_CMD_LINE: "YES"
                GATHER_STATISTICS: "YES"
                #PP_SOLANA_URL: ${CI_PP_SOLANA_URL:-https://api.devnet.solana.com}
                #PYTH_MAPPING_ACCOUNT: ${CI_PYTH_MAPPING_ACCOUNT:-BmA9Z6FjioHJPpjT39QazZyhDRUdZy2ezwx4GiDdE2u2}
                # Set to 0 + CONST_GAS_PRICE to 0, if you want 0 gas-price
                MINIMAL_GAS_PRICE: 1
                CONST_GAS_PRICE: 2
                MINIMAL_WITHOUT_CHAIN_ID_GAS_PRICE: 1
                CU_PRIORITY_FEE: 2
                DEFAULT_CU_PRICE: 10500
                SIMPLE_CU_PRIORITY_FEE: 1
                ENABLE_PRIVATE_API: "NO"
                NEON_CORE_API_SERVER_COUNT: 4
                NEON_EVM_PROGRAM: 53DfF883gyixYNXnM7s5xhdeyV8mVk9T4i2hGV9vG9io
                RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
                COMMIT_LEVEL: Confirmed
                SOLANA_KEY_FOR_EVM_CONFIG: BMp6gEnveANdvSvspESJUrNczuHz1GF5UQKjVLCkAZih
                SOLANA_BLOCK_SEC: "0.1"
              hostname: proxy
              depends_on:
                solana:
                  condition: service_healthy
                dbcreation:
                  condition: service_completed_successfully
              ports:
                - "9090:9090"
              networks:
                - net
              entrypoint: proxy/run-test-proxy.sh
              healthcheck:
                test: [ '/bin/bash', '-c', 'curl http://localhost:9090/solana -s -X POST -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false],\"id\":1}" | grep -cF "number"' ]
                interval: 5s
                timeout: 3s
                retries: 20
                start_period: 5s

            faucet:
              restart: always
              image: ${DOCKERHUB_ORG_NAME}/faucet:${FAUCET_COMMIT}
              container_name: faucet
              environment:
                FAUCET_RPC_BIND: 0.0.0.0
                FAUCET_RPC_PORT: 3333
                FAUCET_WEB3_ENABLE: 'true'
                WEB3_RPC_URL: http://solana:8899
                WEB3_PRIVATE_KEY: 0x4deacb079b4714c38f39508aa8900039f2721ed8686835d43347ba9267da767b
                NEON_ERC20_TOKENS: '["0xB521b9F3484deF53545F276F1DAA50ef0Ca82E2d", "0x8a2a66CA0E5D491A001957edD45A6350bC76D708", "0x914782059DC42d4E590aeFCfdbF004B2EcBB9fAA", "0x7A7510b9b18241C788a7aAE8299D1fA6010D8128"]'
                NEON_ERC20_MAX_AMOUNT: 1000
                FAUCET_SOLANA_ENABLE: 'true'
                SOLANA_URL: http://solana:8899
                NEON_OPERATOR_KEYFILE: /root/.config/solana/id.json
                NEON_ETH_MAX_AMOUNT: 50000
                TEST_FAUCET_INIT_NEON_BALANCE: 100000000
                NEON_EVM_PROGRAM: 53DfF883gyixYNXnM7s5xhdeyV8mVk9T4i2hGV9vG9io
                NEON_TOKEN_MINT: HPsV9Deocecw3GeZv1FkAPNCBRfuVyfw9MMwjwRe1xaU
                NEON_TOKEN_MINT_DECIMALS: 9
                SOLANA_COMMITMENT: confirmed
                RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
              hostname: faucet
              ports:
                - "3333:3333"
              networks:
                - net
              entrypoint: ./run-test-faucet.sh
              depends_on:
                solana:
                  condition: service_healthy

            indexer:
              restart: always
              image: ${DOCKERHUB_ORG_NAME}/neon-proxy.py:${REVISION}
              container_name: indexer
              environment:
                SOLANA_URL: http://solana:8899
                POSTGRES_DB: neon-db
                POSTGRES_USER: neon-proxy
                POSTGRES_PASSWORD: neon-proxy-pass
                POSTGRES_HOST: postgres
                POSTGRES_TIMEOUT: 5
                GATHER_STATISTICS: "YES"
                NEON_EVM_PROGRAM: 53DfF883gyixYNXnM7s5xhdeyV8mVk9T4i2hGV9vG9io
                START_SLOT: latest
                REINDEX_START_SLOT: continue
                INDEXER_CHECK_MSEC: 50
                SOLANA_KEY_FOR_EVM_CONFIG: BMp6gEnveANdvSvspESJUrNczuHz1GF5UQKjVLCkAZih
              hostname: indexer
              depends_on:
                solana:
                  condition: service_healthy
                dbcreation:
                  condition: service_completed_successfully
              networks:
                - net
              entrypoint: indexer/run-indexer.sh

          networks:
            net:
