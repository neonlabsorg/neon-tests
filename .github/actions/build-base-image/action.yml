name: "Build base test image"
description: "Build and push neon test base docker image"
inputs:
  image_tag:
    description: 'neon tests image tag'
    required: true
  image_name:
    description: 'neon tests image name'
    required: true
  oz_tag:
    description: 'tag name for oz tests'
    required: true
    default: latest
  docker_username:
    description: 'docker hub username'
    required: true
  docker_password:
    description: 'docker hub password'
    required: true
  docker_hub_org_name:
    description: 'docker hub organization name'
    required: true
  force_rebuild:
    description: 'flag to force rebuild basic image on current branch'
    required: true
    default: false

outputs:
  image_tag:
    description: 'The tag of the image to use for subsequent steps'
    value: ${{ steps.set_output.outputs.image_tag }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Identify current branch
      id: current_branch
      shell: bash
      run: |
        if [[ "${{ github.ref }}" =~ "refs/heads/"[vt][0-9]+\.[0-9]+\.x ]]; then
          branch_name="${{ github.ref_name }}"
        elif [[ "${{ github.head_ref }}" != "" ]]; then
          branch_name="${{ github.head_ref }}"
        else
          branch_name="${{ github.ref_name }}"
        fi
        echo "branch_name=${branch_name}" >> $GITHUB_OUTPUT
        echo "Current branch: ${branch_name}"

    - name: Identify parent branch
      id: parent_branch
      shell: bash
      run: |
        if [[ "${{ github.event.pull_request.base.ref }}" != "" ]]; then
          # For pull requests, base_ref is the target branch
          parent_name="${{ github.event.pull_request.base.ref }}"
        else
            parent_name="develop"
        fi
        echo "parent_name=${parent_name}" >> $GITHUB_OUTPUT
        echo "Parent branch: ${parent_name}"

    - name: Docker login
      shell: bash
      run: |
        echo "${{ inputs.docker_password }}" | docker login -u ${{ inputs.docker_username }} --password-stdin

    - name: Check if current branch image exists in Docker Hub
      id: check_branch_image
      shell: bash
      run: |
        echo "Checking if image ${{ inputs.image_name }}:${{ steps.current_branch.outputs.branch_name }} exists in Docker Hub"

        if docker manifest inspect ${{ inputs.image_name }}:${{ steps.current_branch.outputs.branch_name }} > /dev/null 2>&1; then
          echo "Current branch image exists in Docker Hub"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "Current branch image does not exist in Docker Hub"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Check if parent branch image exists in Docker Hub
      id: check_parent_image
      shell: bash
      run: |
        echo "Checking if image ${{ inputs.image_name }}:${{ steps.parent_branch.outputs.parent_name }} exists in Docker Hub"

        if docker manifest inspect ${{ inputs.image_name }}:${{ steps.parent_branch.outputs.parent_name }} > /dev/null 2>&1; then
          echo "Parent branch image exists in Docker Hub"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "Parent branch image does not exist in Docker Hub"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Check if requirements folder changed
      id: check_requirements
      shell: bash
      run: |
        # Fetch parent folder
        git fetch --depth 1 origin ${{ steps.parent_branch.outputs.parent_name }}

        # Check if there are changes in the requirements folder or Dockerfile-base
        if git diff --name-only HEAD origin/${{ steps.parent_branch.outputs.parent_name }} | \
          grep -E "^requirements/|^Dockerfile-base$"; then
          echo "Requirements folder or Dockerfile has changed"
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "Requirements folder and Dockerfile have not changed"
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Determine if build is needed
      id: need_build
      shell: bash
      run: |
        # Force rebuild overrides everything
        if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
          echo "Force rebuild requested"
          echo "need_build=true" >> $GITHUB_OUTPUT
          echo "use_image=${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Case 1: Current branch image exists - use it and don't build
        if [[ "${{ steps.check_branch_image.outputs.exists }}" == "true" ]]; then
          echo "Current branch image exists, no need to build"
          echo "need_build=false" >> $GITHUB_OUTPUT
          echo "use_image=${{ inputs.image_name }}:${{ steps.current_branch.outputs.branch_name }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Case 2: Parent branch image exists, requirements changed - need to build
        if [[ "${{ steps.check_parent_image.outputs.exists }}" == "true" && "${{ steps.check_requirements.outputs.changed }}" == "true" ]]; then
          echo "Parent branch image exists but requirements changed, need to build new image"
          echo "need_build=true" >> $GITHUB_OUTPUT
          echo "use_image=${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Case 3: Current branch image doesn't exist, parent branch image exists, no requirements changes - use parent image
        if [[ "${{ steps.check_parent_image.outputs.exists }}" == "true" && "${{ steps.check_requirements.outputs.changed }}" == "false" ]]; then
          echo "Parent branch image exists and requirements didn't change, using parent image"
          echo "need_build=false" >> $GITHUB_OUTPUT
          echo "use_image=${{ inputs.image_name }}:${{ steps.parent_branch.outputs.parent_name }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Case 4: Neither current branch nor parent branch images exist - need to build
        echo "Neither current branch nor parent branch images exist, need to build new image"
        echo "need_build=true" >> $GITHUB_OUTPUT
        echo "use_image=${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT

    - name: Build and push neon tests docker image
      id: build_image
      if: steps.need_build.outputs.need_build == 'true'
      shell: bash
      env:
        DOCKER_HUB_ORG_NAME: ${{ inputs.docker_hub_org_name }}
      run: |
        image_name=${{ inputs.image_name }}
        delimiter=$(printf "%0.s-" {1..30})
        echo " ${delimiter} Build new docker image ${image_name} ${delimiter}"

        docker build . --tag ${image_name}:${{ inputs.image_tag }} \
            --file Dockerfile-base \
            --build-arg OZ_TAG=${{ inputs.oz_tag }} \
            --build-arg CONTRACTS_BRANCH=${{ steps.current_branch.outputs.branch_name || 'develop' }} \
            --build-arg DOCKER_HUB_ORG_NAME=${{env.DOCKER_HUB_ORG_NAME}}

        # Tag with branch name if available
        if [[ "${{ steps.current_branch.outputs.branch_name }}" != "" ]]; then
          docker tag ${image_name}:${{ inputs.image_tag }} ${image_name}:${{ steps.current_branch.outputs.branch_name }}
        fi

        echo "${delimiter} Pushing image to Docker registry ${delimiter}"
        docker push --all-tags ${image_name}

    - name: Skip build notification
      if: steps.need_build.outputs.need_build == 'false'
      shell: bash
      run: |
        echo "Skipping build as using existing image: ${{ steps.need_build.outputs.use_image }}"

    - name: Set output
      id: set_output
      shell: bash
      run: |
        if [[ "${{ steps.need_build.outputs.need_build }}" == "true" ]]; then
          echo "image_tag=${image_name}:${{ steps.current_branch.outputs.branch_name }}" >> $GITHUB_OUTPUT
        else
          # Extract tag from the use_image most likely parent branch
          use_image="${{ steps.need_build.outputs.use_image }}"
          image_tag=${use_image#*:}
          echo "image_tag=${image_tag}" >> $GITHUB_OUTPUT
        fi
