name: "Build base test image"
description: "Build and push neon test base docker image"
inputs:
  image_tag:
    description: 'neon tests image tag'
    required: true
  image_name:
    description: 'neon tests image name'
    required: true
  oz_tag:
    description: 'tag name for oz tests'
    required: true
    default: latest
  docker_username:
    description: 'docker hub username'
    required: true
  docker_password:
    description: 'docker hub password'
    required: true
  docker_hub_org_name:
    description: 'docker hub organization name'
    required: true
  force_rebuild:
    description: 'flag to force rebuild basic image on current branch'
    required: true
    default: false

outputs:
  image_tag:
    description: 'The tag of the image to use for subsequent steps'
    value: ${{ steps.set_output.outputs.image_tag }}

env:
  CURRENT_BRANCH: "${{ github.head_ref || github.ref_name }}"
  PARENT_BRANCH: "${{ github.event.pull_request.base.ref || 'develop' }}"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Set branch variables
      id: set_branches
      shell: bash
      run: |
        # Set current branch
        if [[ -n "${{ github.head_ref }}" ]]; then
          echo "CURRENT_BRANCH=${{ github.head_ref }}" >> $GITHUB_ENV
        else
          echo "CURRENT_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
        fi

        # Set parent branch
        if [[ -n "${{ github.event.pull_request.base.ref }}" ]]; then
          echo "PARENT_BRANCH=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
        else
          echo "PARENT_BRANCH=develop" >> $GITHUB_ENV
        fi

    - name: Docker login
      shell: bash
      run: |
        echo "${{ inputs.docker_password }}" | docker login -u ${{ inputs.docker_username }} --password-stdin
    - name: Check if requirements folder changed
      id: check_requirements
      shell: bash
      run: |
        # Fetch parent folder
        git fetch --depth 1 origin ${{ env.PARENT_BRANCH }}

        # Check if there are changes in the requirements folder or Dockerfile-base
        if git diff --name-only HEAD origin/${{ env.PARENT_BRANCH }} | \
          grep -E "^requirements/|^Dockerfile-base$|^.github/actions/build-base-image/"; then
          echo "Requirements folder | Dockerfile-base | Build-base-image action have changed"
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "Requirements folder | Dockerfile-base | Build-base-image action have not changed"
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Determine if build is needed
      id: need_build
      shell: bash
      run: |
        # Force rebuild overrides everything
        if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
          echo "Force rebuild requested"
          echo "need_build=true" >> $GITHUB_OUTPUT
          echo "use_image=${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Case 1: Parent branch image exists, requirements changed - need to build
        if [[ "${{ steps.check_requirements.outputs.changed }}" == "true" ]]; then
          echo "Parent branch image exists but requirements changed, need to build new image"
          echo "need_build=true" >> $GITHUB_OUTPUT
          echo "use_image=${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Case 2: Current branch image doesn't exist, parent branch image exists, no requirements changes - use parent image
        if [[ "${{ steps.check_requirements.outputs.changed }}" == "false" ]]; then
          echo "Parent branch image exists and requirements didn't change, using parent image"
          echo "need_build=false" >> $GITHUB_OUTPUT
          echo "use_image=${{ inputs.image_name }}:${{ env.PARENT_BRANCH }}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Case 3: Neither current branch nor parent branch images exist - need to build
        echo "Neither current branch nor parent branch images exist, need to build new image"
        echo "need_build=true" >> $GITHUB_OUTPUT
        echo "use_image=${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT

    - name: Build and push neon tests docker image
      id: build_image
      if: steps.need_build.outputs.need_build == 'true'
      shell: bash
      env:
        DOCKER_HUB_ORG_NAME: ${{ inputs.docker_hub_org_name }}
      run: |
        image_name=${{ inputs.image_name }}
        delimiter=$(printf "%0.s-" {1..30})
        echo " ${delimiter} Build new docker image ${image_name} ${delimiter}"

        docker build . --no-cache --tag ${image_name}:${{ inputs.image_tag }} \
            --file Dockerfile-base \
            --build-arg OZ_TAG=${{ inputs.oz_tag }} \
            --build-arg CONTRACTS_BRANCH="main" \
            --build-arg DOCKER_HUB_ORG_NAME=${{env.DOCKER_HUB_ORG_NAME}}

        # Tag with branch name if available
        if [[ "${{ steps.current_branch.outputs.branch_name }}" != "" ]]; then
          docker tag ${image_name}:${{ inputs.image_tag }} ${image_name}:${{ env.CURRENT_BRANCH }}
        fi

        echo "${delimiter} Pushing image to Docker registry ${delimiter}"
        docker push --all-tags ${image_name}

    - name: Skip build notification
      if: steps.need_build.outputs.need_build == 'false'
      shell: bash
      run: |
        echo "Skipping build as using existing image: ${{ steps.need_build.outputs.use_image }}"

    - name: Set output
      id: set_output
      shell: bash
      run: |
        if [[ "${{ steps.need_build.outputs.need_build }}" == "true" ]]; then
          echo "image_tag=${{ env.CURRENT_BRANCH }}" >> $GITHUB_OUTPUT
        else
          # Extract tag from the use_image
          use_image="${{ steps.need_build.outputs.use_image }}"
          image_tag=${use_image#*:}
          echo "image_tag=${image_tag}" >> $GITHUB_OUTPUT
        fi
