name: "Build image"
description: "Build and push neon test docker image"
inputs:
  image_tag:  # id of input
    description: 'neon tests image tag'
    required: true
  image_name:
    description: 'neon tests image name'
    required: true
  oz_tag:
    description: 'tag name for oz tests'
    required: true
    default: latest
  docker_username:
    description: 'docker hub username'
    required: true
  docker_password:
    description: 'docker hub password'
    required: true
  docker_hub_org_name:
    description: 'docker hub organization name'
    required: true

runs:
  using: composite
  steps:
    - name: Define feature or version branch
      id: feature_branch
      shell: bash
      if: github.ref_name !='develop' || github.ref_name !='master'
      run: |
         if [[ "${{ github.ref }}" =~ "refs/heads/"[vt][0-9]+\.[0-9]+\.x ]]; then
          value=${{ github.ref_name }}
         elif [[ "${{ github.head_ref }}" != "" ]]; then # pr to feature/develop branch
          value=${{ github.head_ref }}
         fi;
          echo "value=${value}"
          echo "value=${value}" >> $GITHUB_OUTPUT

    - name: Set up cache directories
      shell: bash
      run: |
        mkdir -p /tmp/.buildx-cache
        mkdir -p /tmp/.apt-cache
        mkdir -p /tmp/.uv-cache

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        driver-opts: network=host

    - name: Define a cache dependency glob
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}

    - name: Build and push neon tests docker image
      id: docker_pipeline
      shell: bash
      env:
        DOCKER_HUB_ORG_NAME: ${{ inputs.docker_hub_org_name }}
        DOCKER_BUILDKIT: 1
      run: |
        image_name=${{ inputs.image_name }}
        delimeter=$(printf "%0.s-" {1..30})
        echo " ${delimeter} Build new docker image ${image_name} ${delimeter}"

        # Pull previous images for cache if available
        docker pull ${image_name}:${{ inputs.image_tag }} || true
        docker pull ${image_name}:develop || true

        # Build with buildkit cache
        docker buildx build . \
            --tag ${image_name}:${{ inputs.image_tag }} \
            --build-arg OZ_TAG='${{ inputs.oz_tag }}' \
            --build-arg CONTRACTS_BRANCH="${{ steps.feature_branch.outputs.value || 'develop'}}" \
            --build-arg DOCKER_HUB_ORG_NAME="${{env.DOCKER_HUB_ORG_NAME}}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --cache-from=${image_name}:${{ inputs.image_tag }} \
            --cache-from=${image_name}:develop \
            --load

        if [[ "${{ steps.feature_branch.outputs.value }}" != ''  ]]; then
          docker tag ${image_name}:${{ inputs.image_tag }} ${image_name}:${{ steps.feature_branch.outputs.value }}
        fi;

        echo "${delimeter} Push image to Docker registry ${delimeter}"
        docker push --all-tags ${image_name}

        # Move cache for next run
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
